[workspace]
resolver = "2"
members = ["crates/gprof-core", "crates/gprof-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ivan Lisovskii <daymedead.dev@gmail.com>"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"
rustc-hash = "2.1"
memmap2 = "0.9"
memchr = "2.7"
regex = "1.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
